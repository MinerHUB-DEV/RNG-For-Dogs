<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🐶 Dog RNG: Global Edition</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent: #533483;
            --btn-color: #e94560;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: white; text-align: center; transition: background 0.5s; overflow-x: hidden; }
        .nav { display: flex; justify-content: center; background: rgba(0,0,0,0.5); padding: 10px; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent); }
        .nav button { margin: 0 5px; padding: 10px 15px; border: none; border-radius: 5px; background: var(--card-bg); color: white; cursor: pointer; font-weight: bold; }
        .stats-bar { background: var(--card-bg); padding: 12px; font-weight: bold; display: flex; justify-content: center; gap: 20px; font-size: 1.1em; }
        
        .panel { display: none; padding: 20px; animation: fadeIn 0.4s; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); max-width: 450px; margin: auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--accent); }
        
        /* POLL STYLING */
        .poll-overlay { display: none; position: fixed; bottom: 20px; right: 20px; width: 280px; background: #fff; color: #333; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 2000; text-align: center; border: 3px solid var(--accent); animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .poll-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .poll-yes { background: #2ecc71; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .poll-no { background: #e74c3c; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .poll-timer-bar { font-size: 0.8em; color: #e94560; margin-top: 10px; font-weight: bold; }

        .global-alert { background: #ff9f43; color: #000; padding: 12px; font-weight: bold; display: none; position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 999; border-radius: 10px; width: 85%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .btn { font-size: 18px; padding: 15px 30px; border-radius: 10px; border: none; background: var(--btn-color); color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { filter: brightness(1.2); }
        .btn:disabled { background: #444 !important; opacity: 0.7; }

        .code-input { padding: 12px; border-radius: 8px; border: none; width: 80%; font-size: 16px; margin-bottom: 10px; }
        .invItem { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px; margin: 8px 0; border-radius: 10px; border-left: 5px solid gray; }
        
        /* RARITY COLORS */
        .common { color: #bdc3c7; border-color: #bdc3c7; }
        .rare { color: #3498db; border-color: #3498db; }
        .epic { color: #9b59b6; border-color: #9b59b6; text-shadow: 0 0 5px #9b59b6; }
        .legendary { color: #f1c40f; border-color: #f1c40f; text-shadow: 0 0 10px #f1c40f; }
        .secret { color: #ff0055; animation: glow 1s infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 5px #ff0000; } to { text-shadow: 0 0 20px #ff0000; } }

        img { width: 100%; height: 250px; object-fit: cover; border-radius: 15px; margin: 15px 0; background: #000; }
    </style>
</head>
<body>

<div id="globalAlert" class="global-alert"></div>

<div id="pollBox" class="poll-overlay">
    <strong id="pollQuestion">New Poll!</strong>
    <div class="poll-btns">
        <button class="poll-yes" onclick="submitVote('yes')">YES</button>
        <button class="poll-no" onclick="submitVote('no')">NO</button>
    </div>
    <div id="pollTimeRemaining" class="poll-timer-bar">Ends in: 0s</div>
</div>

<div class="nav">
    <button onclick="tab('roll')">🎰 Roll</button>
    <button onclick="tab('inv')">📦 Inventory</button>
    <button onclick="tab('shop')">🛒 Shop</button>
    <button id="adminTabBtn" style="display:none; color: #00ffcc;" onclick="tab('admin')">🛡️ Admin</button>
</div>

<div class="stats-bar">
    <span>💰 <span id="coinCount">0</span></span>
    <span>🍀 Luck: +<span id="luckCount">0</span>% <span id="luckTimer"></span></span>
</div>

<div id="roll" class="panel active">
    <div class="card">
        <h2 id="result">Ready?</h2>
        <img id="img" src="https://images.dog.ceo/breeds/poodle-standard/n02113799_2280.jpg">
        <button class="btn" id="rollBtn" onclick="roll()">ROLL DOG</button>
    </div>
</div>

<div id="inv" class="panel">
    <div class="card">
        <h2>📦 Your Inventory</h2>
        <div id="inventoryList"></div>
    </div>
</div>

<div id="admin" class="panel">
    <div class="card" style="border-color: #00ffcc;">
        <h2 style="color: #00ffcc;">🛡️ Global Controls</h2>
        <button class="btn" style="width:100%; margin-bottom:10px;" onclick="adminGlobalBroadcast()">📣 SEND GLOBAL MSG</button>
        <button class="btn" style="width:100%; margin-bottom:10px; background:#00a8ff;" onclick="adminCreatePoll()">📊 START TIMED POLL</button>
        <button class="btn" style="width:100%; background:#9b59b6;" onclick="adminCustomGlobalLuck()">✨ GLOBAL LUCK BOOST</button>
    </div>
</div>

<script>
/* --- DATABASE CONFIG --- */
const DB_URL = "https://dogrng-82d7a-default-rtdb.firebaseio.com/";

/* --- GAME STATE --- */
let coins = 0;
let inventory = [];
let luckEndTime = 0;
let luckPower = 0;
let isAdmin = false;
window.lastMsg = "";
window.currentPollId = null;

const dogs = [
    {name: "Beagle", r: "common"}, {name: "Husky", r: "common"}, {name: "Poodle", r: "common"}, 
    {name: "Shiba Inu", r: "rare"}, {name: "Labrador", r: "rare"}, 
    {name: "Golden Retriever", r: "epic"}, {name: "Samoyed", r: "epic"}, 
    {name: "Great Dane", r: "legendary"}, {name: "Saint Bernard", r: "legendary"},
    {name: "Void Dog", r: "secret"}
];

/* --- GLOBAL SYNC (THE "BRAIN") --- */
async function syncGlobalData() {
    try {
        const res = await fetch(`${DB_URL}.json`);
        const data = await res.json();
        if (!data) return;

        // 1. Check Messages
        if (data.broadcast && data.broadcast !== window.lastMsg) {
            showBroadcast(data.broadcast);
            window.lastMsg = data.broadcast;
        }

        // 2. Check Global Luck
        if (data.globalLuck && data.globalLuck.endTime > Date.now()) {
            luckEndTime = data.globalLuck.endTime;
            luckPower = data.globalLuck.power;
        }

        // 3. Check Polls
        if (data.poll && data.poll.active && Date.now() < data.poll.expires) {
            if (window.currentPollId !== data.poll.id) {
                showGlobalPoll(data.poll);
                window.currentPollId = data.poll.id;
            }
        }
    } catch (e) { console.log("Sync Error"); }
}

/* --- ADMIN FIREBASE ACTIONS --- */
async function adminGlobalBroadcast() {
    let msg = prompt("Message for ALL players:");
    if (msg) await fetch(`${DB_URL}broadcast.json`, { method: 'PUT', body: JSON.stringify(`ADMIN: ${msg}`) });
}

async function adminCreatePoll() {
    let q = prompt("Question:");
    let sec = prompt("Seconds:", "30");
    if (q && sec) {
        let pollData = { id: Date.now(), question: q, active: true, expires: Date.now() + (parseInt(sec) * 1000) };
        await fetch(`${DB_URL}poll.json`, { method: 'PUT', body: JSON.stringify(pollData) });
    }
}

async function adminCustomGlobalLuck() {
    let mins = prompt("Minutes:", "10");
    let pwr = prompt("Luck Power %:", "50");
    if (mins && pwr) {
        let luckData = { endTime: Date.now() + (parseInt(mins) * 60000), power: parseInt(pwr) };
        await fetch(`${DB_URL}globalLuck.json`, { method: 'PUT', body: JSON.stringify(luckData) });
        await fetch(`${DB_URL}broadcast.json`, { method: 'PUT', body: JSON.stringify(`🌟 GLOBAL LUCK +${pwr}% ACTIVATED!`) });
    }
}

async function submitVote(type) {
    document.getElementById("pollBox").style.display = "none";
    // Optional: add logic here to count votes in Firebase if you want to see results!
}

/* --- UI FUNCTIONS --- */
function tab(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function showBroadcast(text) {
    const alertBox = document.getElementById("globalAlert");
    alertBox.innerText = text;
    alertBox.style.display = "block";
    setTimeout(() => alertBox.style.display = "none", 5000);
}

function showGlobalPoll(poll) {
    const box = document.getElementById("pollBox");
    document.getElementById("pollQuestion").innerText = poll.question;
    box.style.display = "block";
    let timer = setInterval(() => {
        let left = Math.ceil((poll.expires - Date.now()) / 1000);
        document.getElementById("pollTimeRemaining").innerText = `Ends in: ${left}s`;
        if (left <= 0) { clearInterval(timer); box.style.display = "none"; }
    }, 1000);
}

function updateUI() {
    document.getElementById("coinCount").innerText = coins;
    if (Date.now() < luckEndTime) {
        document.getElementById("luckCount").innerText = luckPower;
        let diff = Math.ceil((luckEndTime - Date.now()) / 1000);
        document.getElementById("luckTimer").innerText = `(${diff}s)`;
    } else {
        document.getElementById("luckCount").innerText = "0";
        document.getElementById("luckTimer").innerText = "";
    }
}

/* --- GAMEPLAY --- */
async function roll() {
    const btn = document.getElementById("rollBtn");
    btn.disabled = true;
    document.getElementById("result").innerText = "Rolling...";
    
    const res = await fetch('https://dog.ceo/api/breeds/image/random');
    const data = await res.json();
    document.getElementById("img").src = data.message;

    let r = Math.random() * 100 - (luckPower / 5);
    let dog = dogs[0];
    if (r < 1) dog = dogs.find(d => d.r === "secret") || dogs[9];
    else if (r < 10) dog = dogs.find(d => d.r === "legendary");
    else if (r < 30) dog = dogs.find(d => d.r === "epic");
    else if (r < 60) dog = dogs.find(d => d.r === "rare");
    else dog = dogs[Math.floor(Math.random() * 3)];

    inventory.push(dog);
    document.getElementById("result").innerText = dog.name;
    document.getElementById("result").className = dog.r;
    updateInv();
    setTimeout(() => btn.disabled = false, 2000);
    saveGame();
}

function updateInv() {
    let list = document.getElementById("inventoryList");
    list.innerHTML = "";
    inventory.forEach((item, i) => {
        list.innerHTML += `<div class="invItem ${item.r}"><span>${item.name}</span><button onclick="sell(${i})">Sell</button></div>`;
    });
}

function sell(i) {
    coins += 20;
    inventory.splice(i, 1);
    updateInv();
    updateUI();
    saveGame();
}

/* --- SAVE/LOAD --- */
function saveGame() {
    localStorage.setItem('dogRNG_save', JSON.stringify({coins, inventory, isAdmin}));
}

function loadGame() {
    const saved = JSON.parse(localStorage.getItem('dogRNG_save'));
    if (saved) {
        coins = saved.coins || 0;
        inventory = saved.inventory || [];
        isAdmin = saved.isAdmin || false;
        if (isAdmin) document.getElementById("adminTabBtn").style.display = "block";
    }
    // Secret Admin Code Check
    let code = new URLSearchParams(window.location.search).get('admin');
    if (code === 'true') { 
        isAdmin = true; 
        document.getElementById("adminTabBtn").style.display = "block";
        saveGame();
    }
}

// Start Loops
setInterval(syncGlobalData, 3000);
setInterval(updateUI, 1000);
loadGame();
updateInv();
</script>
</body>
</html>
